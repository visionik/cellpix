[project]
name = "pixcell"
version = "0.4.0"
description = "Images in terminal cells: Kitty graphics (Unicode placeholders), iTerm2 images, Sixel and half blocks, still, animated or live, with Textual widgets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pillow>=10.3"]
classifiers = [
    "Environment :: Console",
    "Topic :: Terminals",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
textual = ["textual>=0.80"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual>=0.80"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixcell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
